  // each remaining point, remove every face it can "see", and stitch a fan of
  // new faces from the newly-exposed horizon edges to that point. Returns
  // null for degenerate input (all points coincide, collinear, or coplanar --
  // notably this template is also used for 2D-only PCA runs where every
  // point has z = 0, which is coplanar by construction; see the 2D fallback
  // below).
  function convexHull3D(points) {
    var n = points.length;
    if (n < 4) return null;

    var iA = 0, iB = 1, maxD = -1, i, j;
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        var d0 = vDistSq(points[i], points[j]);
        if (d0 > maxD) { maxD = d0; iA = i; iB = j; }
      }
    }
    if (maxD < 1e-12) return null; // every point coincides

    var ab = vSub(points[iB], points[iA]);
    var iC = -1, maxArea = -1;
    for (i = 0; i < n; i++) {
      if (i === iA || i === iB) continue;
      var cr = vCross(ab, vSub(points[i], points[iA]));
      var area = vDot(cr, cr);
      if (area > maxArea) { maxArea = area; iC = i; }
    }
    if (iC < 0 || maxArea < 1e-12) return null; // all collinear

    var normalABC = vCross(vSub(points[iB], points[iA]), vSub(points[iC], points[iA]));
    var planeScale = Math.sqrt(vDot(normalABC, normalABC));
    var iD = -1, maxDist = -1;
    for (i = 0; i < n; i++) {
      if (i === iA || i === iB || i === iC) continue;
      var dist = Math.abs(vDot(normalABC, vSub(points[i], points[iA])));
      if (dist > maxDist) { maxDist = dist; iD = i; }
    }
    if (iD < 0 || maxDist < 1e-9 * planeScale) return null; // all coplanar

    var centroid = [0, 0, 0];
    [iA, iB, iC, iD].forEach(function (idx) {
      centroid[0] += points[idx][0]; centroid[1] += points[idx][1]; centroid[2] += points[idx][2];
    });
    centroid = [centroid[0] / 4, centroid[1] / 4, centroid[2] / 4];

    function makeFace(a, b, c) {
      var normal = vCross(vSub(points[b], points[a]), vSub(points[c], points[a]));
      var towardCentroid = vDot(normal, vSub(centroid, points[a]));
      return towardCentroid > 0 ? { v: [a, c, b] } : { v: [a, b, c] };
    }

    var faces = [makeFace(iA, iB, iC), makeFace(iA, iB, iD), makeFace(iA, iC, iD), makeFace(iB, iC, iD)];
    var used = {}; used[iA] = used[iB] = used[iC] = used[iD] = true;
    var remaining = [];
    for (i = 0; i < n; i++) if (!used[i]) remaining.push(i);

    function faceNormal(f) {
      var p0 = points[f.v[0]], p1 = points[f.v[1]], p2 = points[f.v[2]];
      return vCross(vSub(p1, p0), vSub(p2, p0));
    }

    remaining.forEach(function (pIdx) {
      var p = points[pIdx];
      var visible = [];
      faces.forEach(function (f, fi) {
        if (vDot(faceNormal(f), vSub(p, points[f.v[0]])) > 1e-9) visible.push(fi);
      });
      if (visible.length === 0) return; // point already inside the current hull

      var visibleSet = {};
      visible.forEach(function (fi) { visibleSet[fi] = true; });

      var edgeToFace = {};
      faces.forEach(function (f, fi) {
        var v = f.v;
        edgeToFace[v[0] + "_" + v[1]] = fi;
        edgeToFace[v[1] + "_" + v[2]] = fi;
        edgeToFace[v[2] + "_" + v[0]] = fi;
      });

      var horizon = [];
      visible.forEach(function (fi) {
        var v = faces[fi].v;
        [[v[0], v[1]], [v[1], v[2]], [v[2], v[0]]].forEach(function (e) {
          var neighborFi = edgeToFace[e[1] + "_" + e[0]];
          if (neighborFi === undefined || !visibleSet[neighborFi]) horizon.push(e);
        });
      });

      faces = faces.filter(function (f, fi) { return !visibleSet[fi]; });
      horizon.forEach(function (e) { faces.push({ v: [e[0], e[1], pIdx] }); });
    });

    return faces;
  }

  // 2D fallback (Andrew's monotone chain on x/y) for groups whose points are
  // coplanar -- in practice, every 2D-only PCA run through this same
  // template, where z is always 0. Produces a single flat, fan-triangulated
  // polygon rather than a volume.
  function convexHull2DFan(points) {
    if (points.length < 3) return null;
    var idx = points.map(function (_, i) { return i; });
    idx.sort(function (a, b) { return points[a][0] - points[b][0] || points[a][1] - points[b][1]; });
    function cross2(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
    var lower = [];
    idx.forEach(function (i) {
      while (lower.length >= 2 && cross2(points[lower[lower.length - 2]], points[lower[lower.length - 1]], points[i]) <= 0) lower.pop();
      lower.push(i);
    });
    var upper = [];
    for (var k = idx.length - 1; k >= 0; k--) {
      var i = idx[k];
      while (upper.length >= 2 && cross2(points[upper[upper.length - 2]], points[upper[upper.length - 1]], points[i]) <= 0) upper.pop();
      upper.push(i);
    }
    lower.pop(); upper.pop();
    var hull = lower.concat(upper);
    if (hull.length < 3) return null;
    var faces = [];
    for (var f = 1; f < hull.length - 1; f++) faces.push({ v: [hull[0], hull[f], hull[f + 1]] });
    return faces;
  }

  function hullFacesFor(points) {
    if (points.length === 3) return [{ v: [0, 1, 2] }];
    return convexHull3D(points) || convexHull2DFan(points);
  }

  function computeGroupHulls(isIncluded) {
    var byGroup = {};
    var summaryByGroup = {};
    DATA.species.forEach(function (s, i) {
      if (!isIncluded(s, i)) return;
      var g = s.group;
      (byGroup[g] || (byGroup[g] = [])).push([s.pc1, s.pc2, s.pc3 || 0]);
      var sum = summaryByGroup[g] || (summaryByGroup[g] = { n: 0, go: [], prot: [] });
      sum.n++;
      sum.go.push(s.go_terms_present);
      if (s.total_prots !== undefined && s.total_prots !== null) sum.prot.push(s.total_prots);
    });
    var hulls = {};
    Object.keys(byGroup).forEach(function (g) {
      var pts = byGroup[g];
      if (pts.length < 3) return; // fewer than a triangle's worth of points
      var faces = hullFacesFor(pts);
      if (faces && faces.length) hulls[g] = { points: pts, faces: faces };
    });
    return { hulls: hulls, summaries: summaryByGroup };
  }

  function mean(arr) {
    if (!arr.length) return null;
    return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
  }
  function median(arr) {
    if (!arr.length) return null;
    var sorted = arr.slice().sort(function (a, b) { return a - b; });
    var mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }

  var groupHulls = {};
  var groupSummaries = {};
  var showEllipses = false;
  var ellipseEls = {};
  var allHullFaceEls = [];

  // Every hull facet and (further below) every species circle lives inside
  // this one group -- axis lines/labels above stay direct children of svg,
  // outside it -- so the whole rotate-affected scene can be hidden with a
  // single DOM write. See enterCanvasPreview: a canvas overlay takes over
  // the live redraw while this group is hidden during an active rotate-drag,
  // which is what keeps rotation fluid at real species counts (redrawing a
  // single canvas surface per frame instead of repainting thousands of
  // individually-styled SVG elements).
  var rotatableGroup = document.createElementNS(svgNS, "g");
  rotatableGroup.setAttribute("id", "rotatable-content");
  svg.appendChild(rotatableGroup);

  var hullFacesGroup = document.createElementNS(svgNS, "g");
  hullFacesGroup.setAttribute("id", "hull-faces");
  rotatableGroup.appendChild(hullFacesGroup);

  function updateEllipses(cosY, sinY, cosX, sinX) {
    Object.keys(groupHulls).forEach(function (g) {
      var hull = groupHulls[g], els = ellipseEls[g];
      var projected = hull.points.map(function (p) {
        var r = rotate3DWithDepth(p[0], p[1], p[2], cosY, sinY, cosX, sinX);
        return [scaleX(r.x), scaleY(r.y), r.z];
      });
      hull.faces.forEach(function (f, fi) {
        var a = projected[f.v[0]], b = projected[f.v[1]], c = projected[f.v[2]];
        els[fi]._depth3d = (a[2] + b[2] + c[2]) / 3;
        els[fi].setAttribute(
          "d",
          "M" + a[0].toFixed(2) + "," + a[1].toFixed(2) +
          " L" + b[0].toFixed(2) + "," + b[1].toFixed(2) +
          " L" + c[0].toFixed(2) + "," + c[1].toFixed(2) + " Z"
        );
      });
    });
  }

  // Recomputes each group's hull from scratch using only the species that
  // currently pass isSpeciesSuppressed (group toggle, GO-count/total_prots
  // thresholds, GO search match) -- so a species filtered out for having too
  // few annotations or proteins actually drops out of the polyhedron's shape
  // instead of just disappearing as a point while still propping up the
  // hull's vertices. The facet count changes whenever the included point set
  // changes, so existing <path> elements can't just be repositioned: every
  // facet is thrown away and recreated. Called through scheduleHullRebuild
  // (debounced) rather than directly from applyVisibility, since the GO
  // count / total_prots rails call applyVisibility on every drag frame, and
  // a full hull recompute (an O(n) incremental algorithm per group) is too
  // slow to redo dozens of times a second for the larger taxon groups.
  function rebuildHulls() {
    var computed = computeGroupHulls(function (s, i) { return !isSpeciesSuppressed(s, i); });
    groupHulls = computed.hulls;
    groupSummaries = computed.summaries;

    // Old facets may have been reparented directly under <svg> by the
    // combined depth sort in applyRotation3D (see there), so clearing
    // hullFacesGroup alone would miss them -- remove each one from wherever
    // it actually ended up, or a rotated view leaves stale facets behind
    // forever, since nothing else ever revisits an element that's no longer
    // referenced by ellipseEls/allHullFaceEls.
    allHullFaceEls.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    ellipseEls = {};
    ALL_GROUPS.forEach(function (g) {
      var hull = groupHulls[g];
      if (!hull) return;
      var color = DATA.groups[g] || "#999999";
      ellipseEls[g] = hull.faces.map(function () {
        var path = document.createElementNS(svgNS, "path");
        path.setAttribute("class", "group-ellipse");
        path.setAttribute("fill", color);
        path.setAttribute("stroke", color);
        path.style.display = "none";
        // Hovering empty polyhedron area (no species point at that pixel)
        // shows the group's own tooltip -- see showGroupTooltip.
        path.addEventListener("mouseenter", function (evt) { if (!isPanning) showGroupTooltip(evt, g); });
        path.addEventListener("mousemove", function (evt) { if (!isPanning) moveTooltip(evt); });
        path.addEventListener("mouseleave", hideTooltip);
        hullFacesGroup.appendChild(path);
        return path;
      });
    });
    allHullFaceEls = [].concat.apply([], ALL_GROUPS.map(function (g) { return ellipseEls[g] || []; }));

    var rebuildTrig = trigFor(td3Yaw, td3Pitch);
    updateEllipses(rebuildTrig.cosY, rebuildTrig.sinY, rebuildTrig.cosX, rebuildTrig.sinX);
    updateEllipseVisibility();
    // While actually rotated, hull facets are interleaved with the scatter
    // points in one shared depth-sorted paint order (see applyRotation3D) --
    // the freshly rebuilt facets above start out back in hullFacesGroup, so
    // that interleaving has to be redone too.
    if (td3Yaw !== 0 || td3Pitch !== 0) applyRotation3D();
  }

  var hullRebuildTimer = null;
  function scheduleHullRebuild() {
    clearTimeout(hullRebuildTimer);
    hullRebuildTimer = setTimeout(rebuildHulls, 150);
  }

  rebuildHulls();

  function updateEllipseVisibility() {
    Object.keys(ellipseEls).forEach(function (g) {
      var show = showEllipses && !hiddenGroups[g];
      ellipseEls[g].forEach(function (el) { el.style.display = show ? "" : "none"; });
    });
  }

  var ellipseOpacityRow = document.getElementById("ellipse-opacity-row");
  var ellipseOpacitySlider = document.getElementById("ellipse-opacity");
  var HULL_STROKE_TO_FILL_RATIO = 0.35 / 0.12; // keep the original fill:stroke look at any opacity

  // Mirrored into plain JS vars (not just the CSS custom properties the real
  // SVG facets read) so the canvas preview can use the current opacity
  // without a getComputedStyle() read (a known layout-forcing call) on every
  // dragged frame.
  var currentHullFillOpacity = 0.12, currentHullStrokeOpacity = 0.35;

  function applyHullOpacity() {
    var fillOpacity = ellipseOpacitySlider.value / 100;
    var strokeOpacity = Math.min(1, fillOpacity * HULL_STROKE_TO_FILL_RATIO);
    currentHullFillOpacity = fillOpacity;
    currentHullStrokeOpacity = strokeOpacity;
    svg.style.setProperty("--hull-fill-opacity", fillOpacity);
    svg.style.setProperty("--hull-stroke-opacity", strokeOpacity);
  }
  ellipseOpacitySlider.oninput = applyHullOpacity;
  applyHullOpacity();

  document.getElementById("ellipse-toggle").onchange = function (evt) {
    showEllipses = evt.target.checked;
    ellipseOpacityRow.classList.toggle("disabled", !showEllipses);
    updateEllipseVisibility();
  };

  DATA.species.forEach(function (s, i) {
    var c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", scaleX(s.pc1));
    c.setAttribute("cy", scaleY(s.pc2));
    c.setAttribute("r", BASE_RADIUS);
    c.setAttribute("data-base-r", BASE_RADIUS);
    c.setAttribute("fill", DATA.groups[s.group] || "#999");
    c.setAttribute("opacity", 0.85);
    c.setAttribute("stroke", "black");
    c.setAttribute("stroke-width", BASE_STROKE_WIDTH);
    c.setAttribute("data-group", s.group);
    c.style.display = hiddenGroups[s.group] ? "none" : "";
    c.addEventListener("mouseenter", function (evt) { if (!isPanning) showTooltip(evt, s, i); });
    c.addEventListener("mousemove", function (evt) { if (!isPanning) moveTooltip(evt); });
    c.addEventListener("mouseleave", hideTooltip);
    c.addEventListener("mouseup", function () { if (!panMoved) openNcbiGenome(s); });
    rotatableGroup.appendChild(c);
    circleEls.push(c);
  });

  // ---- illumination state transitions ----
  // Radius is never touched here -- data-base-r stays at BASE_RADIUS for
  // every point, illuminated or not, so updateMarkerScale (zoom) is the
  // only thing that ever changes marker size.
  function applyBaseStyles() {
    circleEls.forEach(function (c) {
      c.setAttribute("opacity", 0.85);
    });
  }

  function applyIllumination(counts) {
    var alphas = computeAlpha(Array.prototype.slice.call(counts));
    circleEls.forEach(function (c, i) {
      c.setAttribute("opacity", alphas[i]);
    });
  }

  function setSearchStatus(text, isError) {
    var status = document.getElementById("go-search-status");
    status.textContent = text;
    status.classList.toggle("active", !isError && !!text);
    status.classList.toggle("error", !!isError);
  }

  function updateSearchStatus() {
    if (!activeGos.length) {
      setSearchStatus("", false);
      return;
    }
    var idsLabel = activeGos.map(function (g) { return g.go_id; }).join(", ");
    if (goRequireAll) {
      setSearchStatus(
        "Showing only species with all " + activeGos.length +
        " GO term" + (activeGos.length > 1 ? "s" : "") + " present (" + idsLabel + ")",
        false
      );
      return;
    }
    var label = activeGos.length === 1
      ? activeGos[0].go_id + " — " + activeGos[0].description
      : activeGos.length + " GO terms (" + idsLabel + ")";
    setSearchStatus(
      "Illuminating " + label +
      " (opacity = " + (activeGos.length === 1 ? "abundance" : "summed abundance") + ", color = taxon group)",
      false
    );
  }

  function renderGoChips() {
    var container = document.getElementById("go-search-chips");
    container.innerHTML = "";
    activeGos.forEach(function (g) {
      var chip = document.createElement("span");
      chip.className = "go-chip";
      chip.title = g.description;
      var label = document.createElement("span");
      label.textContent = g.go_id;
      var removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "go-chip-remove";
      removeBtn.textContent = "✕";
      removeBtn.title = "Remove " + g.go_id;
      removeBtn.onclick = function () { removeGoTerm(g.go_id); };
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      container.appendChild(chip);
    });
  }

  function clearIllumination() {
    activeGos = [];
    activeGoCounts = [];
    activeCounts = null;
    activeMatchMask = null;
    hideRail();
    applyBaseStyles();
    applyVisibility();
    updateSearchStatus();
    renderGoChips();
  }

  // Loads (or reuses already-loaded) counts for every GO term currently in
  // activeGos and illuminates either by their summed abundance (gradient
  // opacity, threshold rail active) or, under goRequireAll, as a flat
  // on/off match -- a species is fully shown only if it has every selected
  // term at least once, no in-between. One GO behaves the same under either
  // mode's "on" case (present vs not); the two modes only diverge once 2+
  // GO terms are selected.
  function illuminateGos() {
    if (!activeGos.length) {
      clearIllumination();
      return;
    }
    if (!GO_SEARCH_SUPPORTED) {
      setSearchStatus("This browser doesn't support live GO search (needs fetch + DecompressionStream).", true);
      return;
    }
    setSearchStatus("Loading GO data…", false);
    loadGoCounts().then(function (typedArray) {
      activeGoCounts = activeGos.map(function (g) { return countsForGoIndex(typedArray, g.idx); });
      activeCounts = sumCountArrays(activeGoCounts);
      if (goRequireAll) {
        activeMatchMask = matchAllMask(activeGoCounts);
        hideRail();
        applyBaseStyles();
      } else {
        activeMatchMask = null;
        var maxCount = Math.max.apply(null, activeCounts);
        resetRail(maxCount);
        applyIllumination(activeCounts);
      }
      applyVisibility();
      updateSearchStatus();
      renderGoChips();
    }).catch(function (err) {
      setSearchStatus("Could not decode GO data: " + err, true);
    });
  }

  function addGoTerm(goId) {
    var idx = goIndexById[goId];
    if (idx === undefined) {
      setSearchStatus("GO term not found: " + goId, true);
      return;
    }
    if (activeGos.some(function (g) { return g.go_id === goId; })) {
      setSearchStatus(goId + " is already illuminated.", false);
      return;
    }
    activeGos.push({ go_id: goId, description: GO_SEARCH.go_desc[goId] || "unknown", idx: idx });
    illuminateGos();
  }

  function removeGoTerm(goId) {
    activeGos = activeGos.filter(function (g) { return g.go_id !== goId; });
    if (!activeGos.length) {
      clearIllumination();
    } else {
      illuminateGos();
    }
  }

  // ---- search box wiring ----
  var goSearchInput = document.getElementById("go-search-input");
  var goSearchSuggestions = document.getElementById("go-search-suggestions");
  var GO_SEARCH_MAX_SUGGESTIONS = 20;

  function renderSuggestions(matches) {
    goSearchSuggestions.innerHTML = "";
    if (!matches.length) {
      goSearchSuggestions.classList.add("hidden");
      return;
    }
    matches.forEach(function (m) {
      var item = document.createElement("div");
      item.className = "go-suggestion";
      item.innerHTML =
        '<span class="go-suggestion-id">' + escapeHtml(m.id) + "</span>" +
        '<span class="go-suggestion-desc">' + escapeHtml(m.desc) + "</span>";
      item.addEventListener("mousedown", function (evt) {
        evt.preventDefault();
        goSearchInput.value = "";
        goSearchSuggestions.classList.add("hidden");
        addGoTerm(m.id);
      });
      goSearchSuggestions.appendChild(item);
    });
    goSearchSuggestions.classList.remove("hidden");
  }

  function findMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    var matches = [];
    for (var i = 0; i < GO_SEARCH_ENTRIES.length && matches.length < GO_SEARCH_MAX_SUGGESTIONS; i++) {
      if (GO_SEARCH_ENTRIES[i].key.indexOf(q) !== -1) matches.push(GO_SEARCH_ENTRIES[i]);
    }
    return matches;
  }

  goSearchInput.addEventListener("input", function () {
    renderSuggestions(findMatches(goSearchInput.value));
  });

  goSearchInput.addEventListener("keydown", function (evt) {
    if (evt.key === "Escape") {
      goSearchSuggestions.classList.add("hidden");
      return;
    }
    if (evt.key !== "Enter") return;
    evt.preventDefault();
    var query = goSearchInput.value.trim();
    if (!query) return;
    var exact = goIndexById[query] !== undefined ? query
      : (goIndexById[query.toUpperCase()] !== undefined ? query.toUpperCase() : null);
    var target = exact;
    if (!target) {
      var matches = findMatches(query);
      if (matches.length) target = matches[0].id;
    }
    goSearchSuggestions.classList.add("hidden");
    if (target) {
      goSearchInput.value = "";
      addGoTerm(target);
    } else {
      setSearchStatus("GO term not found: " + query, true);
    }
  });

  document.addEventListener("click", function (evt) {
    if (!document.getElementById("go-search-wrap").contains(evt.target)) {
      goSearchSuggestions.classList.add("hidden");
    }
  });

  document.getElementById("go-search-clear-btn").onclick = function () {
    goSearchInput.value = "";
    renderSuggestions([]);
    clearIllumination();
  };

  document.getElementById("go-match-all-toggle").addEventListener("change", function (evt) {
    goRequireAll = evt.target.checked;
    if (activeGos.length) illuminateGos();
  });

  if (!GO_SEARCH_SUPPORTED) {
    goSearchInput.disabled = true;
    goSearchInput.placeholder = "GO search needs a newer browser";
    document.getElementById("go-match-all-toggle").disabled = true;
    setSearchStatus("This browser doesn't support live GO search (needs fetch + DecompressionStream).", true);
  }

  // ---- species search / highlight ----
  // Unlike GO illumination, picking a species never hides or dims anything
  // else -- it just marks the matching dot (bigger radius, amber stroke,
  // brought to front) so it's easy to spot among ~1000+ points, while every
  // other point keeps its normal color/opacity/visibility.
  var SPECIES_ENTRIES = DATA.species.map(function (s, i) {
    var displayName = formatSpeciesName(s.name);
    return { name: s.name, displayName: displayName, group: s.group, idx: i, key: (displayName + " " + s.group).toLowerCase() };
  });
  var speciesHighlightIdx = null;
  var speciesSearchInput = document.getElementById("species-search-input");
  var speciesSearchSuggestions = document.getElementById("species-search-suggestions");
  var SPECIES_SEARCH_MAX_SUGGESTIONS = 20;

  function setSpeciesSearchStatus(text, isError) {
    var status = document.getElementById("species-search-status");
    status.textContent = text;
    status.classList.toggle("active", !isError && !!text);
    status.classList.toggle("error", !!isError);
  }

  function clearSpeciesHighlight() {
    if (speciesHighlightIdx !== null) {
      var prev = circleEls[speciesHighlightIdx];
      prev.setAttribute("data-base-r", BASE_RADIUS);
      prev.setAttribute("stroke", "black");
      prev.classList.remove("species-highlighted");
      updateMarkerScale();
    }
    speciesHighlightIdx = null;
    setSpeciesSearchStatus("", false);
  }

  function highlightSpecies(idx) {
    if (speciesHighlightIdx === idx) return;
    var hadPrevious = speciesHighlightIdx !== null;
    if (hadPrevious) {
      var prev = circleEls[speciesHighlightIdx];
      prev.setAttribute("data-base-r", BASE_RADIUS);
      prev.setAttribute("stroke", "black");
      prev.classList.remove("species-highlighted");
    }
    var s = DATA.species[idx];
    var c = circleEls[idx];
    c.setAttribute("data-base-r", BASE_RADIUS * 2.2);
    c.setAttribute("stroke", "#F5A623");
    c.classList.add("species-highlighted");
    rotatableGroup.appendChild(c); // re-inserting an existing child moves it to the end -> drawn on top
    speciesHighlightIdx = idx;
    updateMarkerScale();
    setSpeciesSearchStatus("Highlighting: " + formatSpeciesName(s.name) + " (" + s.group + ")", false);
  }

  function renderSpeciesSuggestions(matches) {
    speciesSearchSuggestions.innerHTML = "";
    if (!matches.length) {
      speciesSearchSuggestions.classList.add("hidden");
      return;
    }
    matches.forEach(function (m) {
      var item = document.createElement("div");
      item.className = "go-suggestion";
      item.innerHTML =
        '<span class="go-suggestion-id"><i>' + escapeHtml(m.displayName) + "</i></span>" +
        '<span class="go-suggestion-desc">' + escapeHtml(m.group) + "</span>";
      item.addEventListener("mousedown", function (evt) {
        evt.preventDefault();
        speciesSearchInput.value = m.displayName;
        speciesSearchSuggestions.classList.add("hidden");
        highlightSpecies(m.idx);
      });
      speciesSearchSuggestions.appendChild(item);
    });
    speciesSearchSuggestions.classList.remove("hidden");
  }

  function findSpeciesMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    var matches = [];
    for (var i = 0; i < SPECIES_ENTRIES.length && matches.length < SPECIES_SEARCH_MAX_SUGGESTIONS; i++) {
      if (SPECIES_ENTRIES[i].key.indexOf(q) !== -1) matches.push(SPECIES_ENTRIES[i]);
    }
    return matches;
  }

  speciesSearchInput.addEventListener("input", function () {
    renderSpeciesSuggestions(findSpeciesMatches(speciesSearchInput.value));
  });

  speciesSearchInput.addEventListener("keydown", function (evt) {
    if (evt.key === "Escape") {
      speciesSearchSuggestions.classList.add("hidden");
      return;
    }
    if (evt.key !== "Enter") return;
    evt.preventDefault();
    var query = speciesSearchInput.value.trim();
    if (!query) return;
    var matches = findSpeciesMatches(query);
    var exact = matches.find(function (m) {
      return m.displayName.toLowerCase() === query.toLowerCase() || m.name.toLowerCase() === query.toLowerCase();
    });
    var target = exact || matches[0];
    speciesSearchSuggestions.classList.add("hidden");
    if (target) {
      speciesSearchInput.value = target.displayName;
      highlightSpecies(target.idx);
    } else {
      setSpeciesSearchStatus("Species not found: " + query, true);
    }
  });

  document.addEventListener("click", function (evt) {
    if (!document.getElementById("species-search-wrap").contains(evt.target)) {
      speciesSearchSuggestions.classList.add("hidden");
    }
  });

  document.getElementById("species-search-clear-btn").onclick = function () {
    speciesSearchInput.value = "";
    renderSpeciesSuggestions([]);
    clearSpeciesHighlight();
  };

  var PNG_EXPORT_SCALE = 2;
  var LEGEND_ROW_H = 20;
  var LEGEND_SWATCH = 10;
  var LEGEND_GAP = 16;
  var LEGEND_CHAR_PX = 6.3;

  function packLegendRows(legendGroups, rowMaxWidth) {
    var rows = [[]];
    var rowWidth = 0;
    legendGroups.forEach(function (g) {
      var itemWidth = LEGEND_SWATCH + 4 + g.length * LEGEND_CHAR_PX + LEGEND_GAP;
      if (rowWidth + itemWidth > rowMaxWidth && rows[rows.length - 1].length > 0) {
        rows.push([]);
        rowWidth = 0;
      }
      rows[rows.length - 1].push({ name: g, width: itemWidth });
      rowWidth += itemWidth;
    });
    return rows;
  }

  function appendLegendRows(parentSvg, rows, originX, originY) {
    rows.forEach(function (row, rowIdx) {
      var x = originX;
      var y = originY + rowIdx * LEGEND_ROW_H + LEGEND_ROW_H / 2;
      row.forEach(function (item) {
        var swatch = document.createElementNS(svgNS, "circle");
        swatch.setAttribute("cx", x + LEGEND_SWATCH / 2);
        swatch.setAttribute("cy", y);
        swatch.setAttribute("r", LEGEND_SWATCH / 2);
        swatch.setAttribute("fill", DATA.groups[item.name] || "#999");
        swatch.setAttribute("stroke", "black");
        swatch.setAttribute("stroke-width", "0.5");
        parentSvg.appendChild(swatch);

        var label = document.createElementNS(svgNS, "text");
        label.setAttribute("x", x + LEGEND_SWATCH + 4);
        label.setAttribute("y", y + 4);
        label.setAttribute("font-family", "Arial, Helvetica, sans-serif");
        label.setAttribute("font-size", "11");
        label.setAttribute("fill", "#1a1a1a");
        label.textContent = item.name;
        parentSvg.appendChild(label);

        x += item.width;
      });
    });
  }

  function downloadSvgAsPng(exportSvg, width, height, filenameBase) {
    var outW = Math.round(width * PNG_EXPORT_SCALE);
    var outH = Math.round(height * PNG_EXPORT_SCALE);

    var svgString = new XMLSerializer().serializeToString(exportSvg);
    var svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(svgBlob);

    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement("canvas");
      canvas.width = outW;
      canvas.height = outH;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, outW, outH);
      ctx.drawImage(img, 0, 0, outW, outH);
      URL.revokeObjectURL(url);

      canvas.toBlob(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filenameBase + ".png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, "image/png");
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      window.alert("Could not export this PCA as PNG.");
    };
    img.src = url;
  }

  document.getElementById("download-png-btn").onclick = function () {
    var MARGIN = 16;
    var TITLE_H = 28;
    var Y_LABEL_W = 20;
    var X_LABEL_H = 22;

    var rows = packLegendRows(GROUP_ORDER, Y_LABEL_W + PLOT_W);
    var legendH = rows.length * LEGEND_ROW_H;

    var totalW = MARGIN * 2 + Y_LABEL_W + PLOT_W;
    var totalH = MARGIN * 2 + TITLE_H + PLOT_H + X_LABEL_H + legendH;

    var exportSvg = document.createElementNS(svgNS, "svg");
    exportSvg.setAttribute("width", totalW);
    exportSvg.setAttribute("height", totalH);
    exportSvg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);
    exportSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");

    var bg = document.createElementNS(svgNS, "rect");
    bg.setAttribute("x", 0); bg.setAttribute("y", 0);
    bg.setAttribute("width", totalW); bg.setAttribute("height", totalH);
    bg.setAttribute("fill", "#ffffff");
    exportSvg.appendChild(bg);

    var title = document.createElementNS(svgNS, "text");
    title.setAttribute("x", totalW / 2);
    title.setAttribute("y", MARGIN + 18);
    title.setAttribute("text-anchor", "middle");
    title.setAttribute("font-family", "Arial, Helvetica, sans-serif");
    title.setAttribute("font-size", "15");
    title.setAttribute("font-weight", "bold");
    title.textContent = activeGos.length
      ? DATA.meta.title + " — illuminated: " + activeGos.map(function (g) { return g.go_id; }).join(", ")
      : DATA.meta.title;
    exportSvg.appendChild(title);

    var plotClone = svg.cloneNode(true);
    plotClone.removeAttribute("class");
    plotClone.setAttribute("width", PLOT_W);
    plotClone.setAttribute("height", PLOT_H);
    plotClone.setAttribute("x", MARGIN + Y_LABEL_W);
    plotClone.setAttribute("y", MARGIN + TITLE_H);
    exportSvg.appendChild(plotClone);

    var yLabel = document.createElementNS(svgNS, "text");
    var yLabelX = MARGIN + 10;
    var yLabelY = MARGIN + TITLE_H + PLOT_H / 2;
    yLabel.setAttribute("transform", "translate(" + yLabelX + "," + yLabelY + ") rotate(-90)");
    yLabel.setAttribute("text-anchor", "middle");
    yLabel.setAttribute("font-family", "Arial, Helvetica, sans-serif");
    yLabel.setAttribute("font-size", "12");
    yLabel.setAttribute("fill", "#555");
    yLabel.textContent = PC2_LABEL;
    exportSvg.appendChild(yLabel);

    var xLabel = document.createElementNS(svgNS, "text");
    xLabel.setAttribute("x", MARGIN + Y_LABEL_W + PLOT_W / 2);
    xLabel.setAttribute("y", MARGIN + TITLE_H + PLOT_H + 16);
    xLabel.setAttribute("text-anchor", "middle");
    xLabel.setAttribute("font-family", "Arial, Helvetica, sans-serif");
    xLabel.setAttribute("font-size", "12");
    xLabel.setAttribute("fill", "#555");
    xLabel.textContent = PC1_LABEL;
    exportSvg.appendChild(xLabel);

    appendLegendRows(exportSvg, rows, MARGIN + Y_LABEL_W, MARGIN + TITLE_H + PLOT_H + X_LABEL_H);

    downloadSvgAsPng(exportSvg, totalW, totalH, DATA.meta.filename_base);
  };

  // Build the GO-count threshold rail DOM once (shown/hidden by resetRail/hideRail).
  (function () {
    railMaxInput = document.createElement("input");
    railMaxInput.type = "number";
    railMaxInput.min = "0";
    railMaxInput.className = "threshold-rail-input";
    railEl.appendChild(railMaxInput);

    railTrackEl = document.createElement("div");
    railTrackEl.className = "threshold-rail-track";
    railFill = document.createElement("div");
    railFill.className = "threshold-rail-fill";
    railMinHandle = document.createElement("div");
    railMinHandle.className = "threshold-rail-handle";
    railMaxHandle = document.createElement("div");
    railMaxHandle.className = "threshold-rail-handle";
    railTrackEl.appendChild(railFill);
    railTrackEl.appendChild(railMinHandle);
    railTrackEl.appendChild(railMaxHandle);
    railEl.appendChild(railTrackEl);

    railMinInput = document.createElement("input");
    railMinInput.type = "number";
    railMinInput.min = "0";
    railMinInput.className = "threshold-rail-input";
    railEl.appendChild(railMinInput);

    railMinInput.oninput = function () { setRailMin(parseFloat(railMinInput.value)); };
    railMaxInput.oninput = function () { setRailMax(parseFloat(railMaxInput.value)); };

    function valueFromClientY(clientY) {
      var rect = railTrackEl.getBoundingClientRect();
      var frac = Math.min(1, Math.max(0, (rect.bottom - clientY) / rect.height));
      return frac * railTrackMax;
    }

    function startDrag(setter) {
      return function (evt) {
        evt.preventDefault();
        setter(valueFromClientY(evt.clientY));
        function onMove(e) { setter(valueFromClientY(e.clientY)); }
        function onUp() {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      };
    }

    railMinHandle.addEventListener("mousedown", startDrag(setRailMin));
    railMaxHandle.addEventListener("mousedown", startDrag(setRailMax));
    railTrackEl.addEventListener("mousedown", function (evt) {
      if (evt.target === railMinHandle || evt.target === railMaxHandle) return;
      var v = valueFromClientY(evt.clientY);
      (Math.abs(v - goCountMin) <= Math.abs(v - (goCountMax === Infinity ? railTrackMax : goCountMax))
        ? setRailMin : setRailMax)(v);
    });

    positionRailHandles();
  })();

  // Build the total-proteins threshold rail DOM, and activate it right
  // away (no search needed -- total_prots is static per-species data, so
  // there's no "nothing illuminated yet" state to wait out).
  if (HAS_TOTAL_PROTS) {
    tpRailMaxInput = document.createElement("input");
    tpRailMaxInput.type = "number";
    tpRailMaxInput.min = "0";
    tpRailMaxInput.className = "threshold-rail-input";
    tpRailEl.appendChild(tpRailMaxInput);

    tpRailTrackEl = document.createElement("div");
    tpRailTrackEl.className = "threshold-rail-track";
    tpRailFill = document.createElement("div");
    tpRailFill.className = "threshold-rail-fill";
    tpRailMinHandle = document.createElement("div");
    tpRailMinHandle.className = "threshold-rail-handle";
    tpRailMaxHandle = document.createElement("div");
    tpRailMaxHandle.className = "threshold-rail-handle";
    tpRailTrackEl.appendChild(tpRailFill);
    tpRailTrackEl.appendChild(tpRailMinHandle);
    tpRailTrackEl.appendChild(tpRailMaxHandle);
    tpRailEl.appendChild(tpRailTrackEl);

    tpRailMinInput = document.createElement("input");
    tpRailMinInput.type = "number";
    tpRailMinInput.min = "0";
    tpRailMinInput.className = "threshold-rail-input";
    tpRailEl.appendChild(tpRailMinInput);

    tpRailMinInput.oninput = function () { setTpRailMin(parseFloat(tpRailMinInput.value)); };
    tpRailMaxInput.oninput = function () { setTpRailMax(parseFloat(tpRailMaxInput.value)); };

    (function () {
      function valueFromClientY(clientY) {
        var rect = tpRailTrackEl.getBoundingClientRect();
        var frac = Math.min(1, Math.max(0, (rect.bottom - clientY) / rect.height));
        return frac * tpRailTrackMax;
      }
      function startDrag(setter) {
        return function (evt) {
          evt.preventDefault();
          setter(valueFromClientY(evt.clientY));
          function onMove(e) { setter(valueFromClientY(e.clientY)); }
          function onUp() {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          }
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        };
      }
      tpRailMinHandle.addEventListener("mousedown", startDrag(setTpRailMin));
      tpRailMaxHandle.addEventListener("mousedown", startDrag(setTpRailMax));
      tpRailTrackEl.addEventListener("mousedown", function (evt) {
        if (evt.target === tpRailMinHandle || evt.target === tpRailMaxHandle) return;
        var v = valueFromClientY(evt.clientY);
        (Math.abs(v - tpMin) <= Math.abs(v - (tpMax === Infinity ? tpRailTrackMax : tpMax))
          ? setTpRailMin : setTpRailMax)(v);
      });
    })();

    tpRailTrackMax = Math.max.apply(null, DATA.species.map(tpValueOf));
    tpMin = 0;
    tpMax = tpRailTrackMax;
    tpRailMinInput.value = 0;
    tpRailMaxInput.value = tpRailTrackMax;
    positionTpRailHandles();
    tpRailEl.classList.remove("inactive");
  }

  // ---- 3D rotation (PC1/PC2/PC3), built directly into the plot ----
  // Rotates each point's real (pc1, pc2, pc3) and re-projects through the
  // exact same scaleX/scaleY + viewBox zoom/pan already used for the 2D
  // view, instead of a separate canvas with its own perspective projection.
  // At yaw=pitch=0 the rotation is the identity on x/y (z drops out
  // entirely -- see rotate3D), so the page loads pixel-identical to a plain
  // 2D PCA, and only moves once the user actually drags to rotate -- no
  // toggle button, dragging just rotates directly. Every existing
  // interaction (GO illumination, taxon hide/show, tooltip, wheel zoom,
  // legend reordering, NCBI click-through) keeps working completely
  // unmodified, since this only repositions the same <circle> elements
  // already on the page. Only enabled at all when every species record
  // carries a pc3 (general_pca_abundance.py always fits 3 components;
  // presence_absence_pca.py and other 2D-only consumers of this same
  // template don't, so dragging there stays plain pan, unchanged).
  var HAS_3D = DATA.species.length > 0 &&
    DATA.species.every(function (s) { return s.pc3 !== undefined && s.pc3 !== null; });
  var info3d = document.getElementById("pc3d-info");
  var info3dReady = false;
  var ROTATE_SPEED = 0.01; // radians per pixel dragged

  document.querySelector(".plot-hint").textContent = HAS_3D
    ? "Drag to rotate, Shift+drag to pan, scroll to zoom, click a species for its NCBI genome page."
    : "Scroll to zoom, drag to pan, click a species for its NCBI genome page.";

  // Takes precomputed cos/sin of yaw and pitch rather than the angles
  // themselves -- yaw/pitch are fixed for an entire frame (thousands of
  // points + hull vertices all rotate by the same amount), so computing
  // Math.cos/Math.sin once per frame and reusing them here, instead of
  // recomputing all four inside this function on every single point/vertex
  // call, cuts out tens of thousands of redundant trig evaluations per
  // frame at real species counts -- a big share of why dragging felt heavy
  // once there were actually points on screen.
  function rotate3D(x, y, z, cosY, sinY, cosX, sinX) {
    var x1 = x * cosY + z * sinY;
    var z1 = -x * sinY + z * cosY;
    var y2 = y * cosX - z1 * sinX; // at yaw=pitch=0: x1=x, y2=y -- z drops out
    return { x: x1, y: y2 };
  }

  // Same rotation as rotate3D, but also keeps the depth component (z2)
  // instead of dropping it -- needed below to sort points front-to-back by
  // where they actually are in 3D, rather than by cx/cy screen position.
  function rotate3DWithDepth(x, y, z, cosY, sinY, cosX, sinX) {
    var x1 = x * cosY + z * sinY;
    var z1 = -x * sinY + z * cosY;
    var y2 = y * cosX - z1 * sinX;
    var z2 = y * sinX + z1 * cosX;
    return { x: x1, y: y2, z: z2 };
  }

  // One trig evaluation per axis per frame, shared by every rotate3D/
  // rotate3DWithDepth call that frame needs (see the comment on rotate3D).
  function trigFor(yaw, pitch) {
    return { cosY: Math.cos(yaw), sinY: Math.sin(yaw), cosX: Math.cos(pitch), sinX: Math.sin(pitch) };
  }

  // Shared by applyRotation3D (the real SVG, on a full sync) and
  // drawCanvasPreview (every live preview frame) -- axis lines are cheap
  // (3 lines + labels) and stay real SVG elements even during the canvas
  // preview rather than moving to canvas too, but they still need repositioning
  // every frame or they'd stay frozen at their pre-drag position for the
  // whole gesture, only snapping to correct at the end.
  function updateAxisLines(trig) {
    axisLines.forEach(function (axis) {
      var r1 = rotate3D(axis.p1[0], axis.p1[1], axis.p1[2], trig.cosY, trig.sinY, trig.cosX, trig.sinX);
      var r2 = rotate3D(axis.p2[0], axis.p2[1], axis.p2[2], trig.cosY, trig.sinY, trig.cosX, trig.sinX);
      axis.el.setAttribute("x1", scaleX(r1.x)); axis.el.setAttribute("y1", scaleY(r1.y));
      axis.el.setAttribute("x2", scaleX(r2.x)); axis.el.setAttribute("y2", scaleY(r2.y));
      axis.labelEl.setAttribute("x", scaleX(r2.x) + 4);
      axis.labelEl.setAttribute("y", scaleY(r2.y) - 4);
    });
  }

  function applyRotation3D() {
    // At yaw = pitch = 0 the page must stay pixel-identical to a plain 2D
    // PCA (see HAS_3D above), so paint order there still follows the
    // legend's manual group order, and every hull facet stays behind every
    // point (its original, always-behind grouping). But the moment you
    // actually rotate, "in front" has a real geometric answer -- the
    // legend's layer order stops applying, and points AND hull facets alike
    // are reordered together by their own rotated depth, nearest-last so it
    // paints on top. This is what makes a point from another group actually
    // disappear behind a group's translucent polyhedron once it is behind
    // it, instead of every point always painting over every hull face.
    var rotated = td3Yaw !== 0 || td3Pitch !== 0;
    var trig = trigFor(td3Yaw, td3Pitch);

    circleEls.forEach(function (c, i) {
      var s = DATA.species[i];
      var r = rotate3DWithDepth(s.pc1, s.pc2, s.pc3, trig.cosY, trig.sinY, trig.cosX, trig.sinX);
      c.setAttribute("cx", scaleX(r.x));
      c.setAttribute("cy", scaleY(r.y));
      c._depth3d = r.z;
    });
    updateEllipses(trig.cosY, trig.sinY, trig.cosX, trig.sinX); // also stamps _depth3d on each hull facet

    if (rotated) {
      // Built into a detached DocumentFragment first, then attached to the
      // live SVG in one shot -- appending straight to svg in the loop would
      // mean one live-tree remove+reinsert per point/facet (thousands of
      // reflow-triggering DOM mutations per dragged frame, the main source
      // of drag jank at real species counts); a fragment absorbs all of
      // that reordering off-tree and costs a single live mutation instead.
      var sortedFrag = document.createDocumentFragment();
      circleEls.concat(allHullFaceEls)
        .sort(function (a, b) { return a._depth3d - b._depth3d; })
        .forEach(function (el) { sortedFrag.appendChild(el); });
      rotatableGroup.appendChild(sortedFrag);
    } else {
      reorderCirclesByGroupOrder();
      allHullFaceEls.forEach(function (el) { hullFacesGroup.appendChild(el); });
    }
    updateAxisLines(trig);

    // The explained-variance box only appears once actually rotated away
    // from the flat (yaw=pitch=0) layout -- hidden again if rotation is
    // ever brought back to exactly 0 (e.g. via the reset button), so it
    // never shows on a page that still looks like a plain 2D PCA.
    if (rotated && !info3dReady) {
      info3d.innerHTML = "Explained variance<br>" +
        ["PC1", "PC2", "PC3"].map(function (label, i) {
          return label + ": " + ((EXPLAINED[i] || 0) * 100).toFixed(1) + "%";
        }).join("<br>");
      info3dReady = true;
    }
    info3d.style.display = rotated ? "" : "none";
  }

  if (HAS_3D) {
    var resetZoomBtn = document.getElementById("reset-zoom-btn");
    resetZoomBtn.textContent = "Reset rotation/zoom";
    resetZoomBtn.onclick = function () {
      td3Yaw = 0; td3Pitch = 0;
      applyRotation3D();
      resetViewBox();
    };

    // Arrow-button alternative to drag-to-rotate -- same step size feel as a
    // short drag. Pitch is unbounded here too, same as yaw (see the drag
    // handler above).
    var ROTATE_STEP = Math.PI / 18; // 10 degrees per click
    function nudgeRotation(dYaw, dPitch) {
      td3Yaw += dYaw;
      td3Pitch += dPitch;
      applyRotation3D();
    }
    document.getElementById("rotate-up").onclick = function () { nudgeRotation(0, -ROTATE_STEP); };
    document.getElementById("rotate-down").onclick = function () { nudgeRotation(0, ROTATE_STEP); };
    document.getElementById("rotate-left").onclick = function () { nudgeRotation(-ROTATE_STEP, 0); };
    document.getElementById("rotate-right").onclick = function () { nudgeRotation(ROTATE_STEP, 0); };
    document.getElementById("rotate-pad").style.display = "grid";

    // Press-and-hold keyboard rotation: unlike the rotate-pad buttons above
    // (one fixed ROTATE_STEP nudge per click), holding an arrow key rotates
    // continuously at a constant angular velocity for as long as it's held,
    // driven by requestAnimationFrame + measured delta time rather than a
    // fixed step per keydown (so the rotation speed doesn't depend on the
    // browser's key-repeat rate, which varies by OS/browser and is usually
    // much slower than 60fps). Routes through the same canvas-preview path
    // as drag-rotation, for the same reason: a held key drives just as many
    // rotation updates per second as a mouse drag does.
    var ROTATE_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
    var KEYBOARD_ROTATE_RAD_PER_SEC = Math.PI * 0.6; // ~108 deg/sec
    var heldRotateKeys = Object.create(null);
    var keyboardRotateFrame = null;
    var keyboardRotateLastT = null;

    function isTypingTarget(evt) {
      var tag = evt.target && evt.target.tagName;
      return tag === "INPUT" || tag === "TEXTAREA";
    }

    function keyboardRotateTick(t) {
      var dt = keyboardRotateLastT === null ? 0 : (t - keyboardRotateLastT) / 1000;
      keyboardRotateLastT = t;
      var dYaw = 0, dPitch = 0;
      if (heldRotateKeys.ArrowLeft) dYaw -= 1;
      if (heldRotateKeys.ArrowRight) dYaw += 1;
      if (heldRotateKeys.ArrowUp) dPitch -= 1;
      if (heldRotateKeys.ArrowDown) dPitch += 1;
      if (dYaw || dPitch) {
        td3Yaw += dYaw * KEYBOARD_ROTATE_RAD_PER_SEC * dt;
        td3Pitch += dPitch * KEYBOARD_ROTATE_RAD_PER_SEC * dt; // unbounded, same as yaw
        enterCanvasPreview();
        drawCanvasPreview();
        keyboardRotateFrame = requestAnimationFrame(keyboardRotateTick);
      } else {
        keyboardRotateFrame = null;
        keyboardRotateLastT = null;
        exitCanvasPreview();
      }
    }

    function ensureKeyboardRotateLoop() {
      if (keyboardRotateFrame === null) {
        keyboardRotateLastT = null;
        keyboardRotateFrame = requestAnimationFrame(keyboardRotateTick);
      }
    }

    // evt.repeat (OS key-auto-repeat while held) fires many keydown events
    // for the same key -- harmless here since both heldRotateKeys[key]=true
    // and ensureKeyboardRotateLoop() are idempotent, so no need to filter it
    // out explicitly.
    window.addEventListener("keydown", function (evt) {
      if (!ROTATE_KEYS[evt.key] || isTypingTarget(evt)) return;
      evt.preventDefault();
      heldRotateKeys[evt.key] = true;
      ensureKeyboardRotateLoop();
    });
    window.addEventListener("keyup", function (evt) {
      if (!ROTATE_KEYS[evt.key]) return;
      delete heldRotateKeys[evt.key];
    });
    // Releasing keys away from the page (e.g. alt-tabbing mid-hold) would
    // otherwise leave a key "stuck" held forever, since no keyup ever fires.
    window.addEventListener("blur", function () {
      heldRotateKeys = Object.create(null);
    });
  }

  buildSidebarLegend();
  buildSidebarTopLoadings();
})();
</script>
</body>
</html>
