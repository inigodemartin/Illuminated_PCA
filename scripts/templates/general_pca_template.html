<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__GENERAL_PCA_TITLE__</title>
<style>
  :root {
    color-scheme: light;
  }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: #f5f6f8;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    box-sizing: border-box;
    padding: 16px 24px;
    margin-right: 260px;
    background: #2c3e50;
    color: #fff;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 18px;
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: #cbd5e1;
  }
  #toolbar {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  #go-search-wrap, #species-search-wrap {
    position: relative;
    flex: 1 1 320px;
    max-width: 420px;
  }
  #go-search-input, #species-search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 8px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.92);
    color: #1a1a1a;
    font-size: 12px;
  }
  #go-search-suggestions, #species-search-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 2px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 700;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
  }
  #go-search-suggestions.hidden, #species-search-suggestions.hidden {
    display: none;
  }
  .go-suggestion {
    padding: 5px 8px;
    font-size: 12px;
    color: #1a1a1a;
    cursor: pointer;
    border-bottom: 1px solid #eef1f5;
  }
  .go-suggestion:last-child {
    border-bottom: none;
  }
  .go-suggestion:hover {
    background: #eef2ff;
  }
  .go-suggestion-id {
    font-weight: 600;
    margin-right: 6px;
  }
  .go-suggestion-desc {
    color: #64748b;
  }
  #go-search-status, #species-search-status {
    margin: 6px 0 0;
    font-size: 12px;
    color: #cbd5e1;
    min-height: 14px;
  }
  #go-search-status.active, #species-search-status.active {
    color: #fbbf24;
    font-weight: 600;
  }
  #go-search-status.error, #species-search-status.error {
    color: #fca5a5;
    font-weight: 600;
  }
  #go-search-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .go-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    padding: 2px 6px 2px 10px;
    font-size: 11px;
    color: #fff;
  }
  .go-chip-remove {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0 2px;
    opacity: 0.75;
  }
  .go-chip-remove:hover {
    opacity: 1;
  }
  circle.species-highlighted {
    filter: drop-shadow(0 0 4px rgba(245, 166, 35, 0.95));
  }
  .toolbar-btn {
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-radius: 4px;
    font-size: 12px;
    padding: 4px 10px;
  }
  .toolbar-btn:hover {
    background: rgba(255,255,255,0.22);
  }
  #go-match-mode-label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  #go-match-mode-label input {
    margin: 0;
  }
  #sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 250px;
    height: 100vh;
    overflow-y: auto;
    background: #f8fafc;
    border-left: 1px solid #cbd5e1;
    box-shadow: -2px 0 8px rgba(0,0,0,0.06);
    padding: 16px;
    box-sizing: border-box;
    z-index: 600;
  }
  .sidebar-section {
    margin-bottom: 22px;
  }
  .sidebar-section h4 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #334155;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .legend-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .legend-action {
    cursor: pointer;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 4px;
    font-size: 11px;
    padding: 2px 8px;
    color: #334155;
  }
  .legend-action:hover {
    background: #e2e8f0;
  }
  .legend-hint {
    font-size: 10.5px;
    color: #94a3b8;
    margin: -2px 0 8px;
  }
  .legend {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 2px 2px;
    border-radius: 4px;
  }
  .legend-row:hover {
    background: #eef2f7;
  }
  .legend-row.dragging {
    opacity: 0.4;
  }
  .legend-drag-handle {
    cursor: grab;
    color: #94a3b8;
    font-size: 12px;
    line-height: 1;
    padding: 0 2px;
    user-select: none;
  }
  .legend-drag-handle:active {
    cursor: grabbing;
  }
  .legend label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    flex: 1;
    min-width: 0;
  }
  .legend .swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: 1px solid rgba(0, 0, 0, 0.25);
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
    background: none;
  }
  .legend .swatch::-webkit-color-swatch-wrapper {
    padding: 0;
    border-radius: 50%;
  }
  .legend .swatch::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
  }
  .legend .swatch::-moz-color-swatch {
    border: none;
    border-radius: 50%;
  }
  .legend .count {
    color: #94a3b8;
  }
  .loading-group {
    border: 1px solid #e2e8f0;
    border-radius: 5px;
    margin: 0 0 6px;
    overflow: hidden;
  }
  .loading-group summary {
    font-size: 11px;
    font-weight: 600;
    color: #334155;
    padding: 6px 8px;
    cursor: pointer;
    background: #f8fafc;
    list-style: none;
  }
  .loading-group summary::-webkit-details-marker {
    display: none;
  }
  .loading-group summary::before {
    content: "\25B8";
    display: inline-block;
    width: 0.8em;
    margin-right: 4px;
    color: #94a3b8;
    transition: transform 0.15s;
  }
  .loading-group[open] summary {
    border-bottom: 1px solid #e2e8f0;
  }
  .loading-group[open] summary::before {
    transform: rotate(90deg);
  }
  .loading-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    padding: 3px 8px;
    border-bottom: 1px solid #eef1f5;
    font-size: 11px;
  }
  .loading-row:last-child {
    border-bottom: none;
  }
  .loading-go {
    font-weight: 600;
    color: #1f2937;
  }
  .loading-value {
    color: #64748b;
    font-family: monospace;
  }
  .loading-desc {
    flex: 1 1 100%;
    color: #64748b;
  }
  #plot-container {
    flex: 1 1 auto;
    min-height: 0;
    margin-right: 260px;
    padding: 20px 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .plot-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 16px 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  #pc3d-info {
    position: absolute;
    top: 32px;
    left: 40px;
    background: rgba(255,255,255,0.92);
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    color: #333;
    line-height: 1.5;
    pointer-events: none;
  }
  /* Keyboard/click alternative to drag-to-rotate, for anyone (or any
     screenshot/embedding context) without an easy mouse-drag gesture. Only
     shown when HAS_3D (see the rotation setup below), same gating as the
     "Drag to rotate" plot hint text. */
  .rotate-pad {
    position: absolute;
    left: 40px;
    bottom: 40px;
    display: grid;
    grid-template-areas:
      ".    up    ."
      "left .     right"
      ".    down  .";
    grid-template-columns: 26px 26px 26px;
    grid-template-rows: 26px 26px 26px;
    gap: 2px;
  }
  .rotate-pad button {
    border: 1px solid #cbd5e1;
    background: rgba(255,255,255,0.85);
    border-radius: 4px;
    font-size: 10px;
    line-height: 1;
    color: #64748b;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .rotate-pad button:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
    color: #334155;
  }
  .rotate-pad button:active {
    background: #e2e8f0;
  }
  #rotate-up { grid-area: up; }
  #rotate-left { grid-area: left; }
  #rotate-right { grid-area: right; }
  #rotate-down { grid-area: down; }
  .plot-row {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: 4px;
  }
  .axis-label-y {
    flex: 0 0 auto;
    width: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .axis-label-y span {
    display: inline-block;
    transform: rotate(-90deg);
    white-space: nowrap;
    font-size: 12px;
    color: #555;
  }
  .axis-label-x {
    flex: 0 0 auto;
    text-align: center;
    font-size: 12px;
    color: #555;
    margin-top: 4px;
  }
  .plot-hint {
    flex: 0 0 auto;
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
  }
  #scatter-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }
  .scatter {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  .scatter.panning {
    cursor: grabbing;
  }
  /* Shown only while actively dragging/rotating (see enterCanvasPreview) --
     a fast single-surface stand-in for the real SVG points+hulls, which are
     hidden for the duration of the drag. Never receives pointer events
     itself: rotate/pan is already handled by listeners on the SVG/window,
     and nothing needs to be hoverable/clickable mid-drag (the real elements
     already suppress tooltips/clicks while isPanning is true). */
  #points-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    pointer-events: none;
  }
  .scatter circle {
    transition: opacity 0.1s;
    cursor: pointer;
  }
  .threshold-rail {
    flex: 0 0 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
    user-select: none;
    --rail-color: #6366f1;
    --rail-color-light: #eef2ff;
    --rail-color-mid: #c7d2fe;
  }
  .threshold-rail.inactive {
    visibility: hidden;
    pointer-events: none;
  }
  /* Each rail gets its own accent color so the two are distinguishable at
     a glance -- muted indigo for GO-term abundance, muted amber for total
     proteins. Kept deliberately subdued (rather than a saturated brand
     color) since the fill is the loudest thing on a narrow sidebar rail. */
  .rail-go {
    --rail-color: #8a8fc0;
    --rail-color-light: #eef2ff;
    --rail-color-mid: #c7d2fe;
  }
  .rail-prot {
    --rail-color: #c9a35c;
    --rail-color-light: #fff4e0;
    --rail-color-mid: #fde3b0;
  }
  .rail-label {
    flex: 0 0 auto;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.2;
    white-space: normal;
    margin: 4px 0;
  }
  .threshold-rail-input {
    width: 32px;
    font-size: 10px;
    text-align: center;
    border: 1px solid #cbd5e1;
    border-radius: 3px;
    padding: 1px 2px;
    background: #f8fafc;
    color: #1a1a1a;
  }
  .threshold-rail-input:hover,
  .threshold-rail-input:focus {
    border-color: var(--rail-color);
    outline: none;
  }
  .threshold-rail-input::-webkit-inner-spin-button,
  .threshold-rail-input::-webkit-outer-spin-button {
    display: none;
  }
  .threshold-rail-track {
    flex: 1 1 auto;
    width: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    position: relative;
    cursor: pointer;
  }
  .threshold-rail-fill {
    position: absolute;
    left: 0; right: 0;
    background: var(--rail-color);
    border-radius: 3px;
  }
  .threshold-rail-handle {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--rail-color);
    cursor: ns-resize;
    box-sizing: border-box;
  }
  .threshold-rail-handle:hover {
    background: var(--rail-color-light);
  }
  .threshold-rail-handle:active {
    background: var(--rail-color-mid);
  }
  .axis-line {
    stroke: #9ca3af;
    stroke-dasharray: 4 3;
    stroke-width: 1;
  }
  .axis-line-label {
    fill: #555;
    font-size: 11px;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    pointer-events: none;
    user-select: none;
  }
  .group-ellipse {
    fill-opacity: var(--hull-fill-opacity, 0.12);
    stroke-opacity: var(--hull-stroke-opacity, 0.35);
    stroke-width: 1;
    /* Hoverable (see showGroupTooltip) -- a species point sitting on top of
       a facet still wins the hover, since paint order is also DOM/z order
       and pointer-events hit-tests the topmost element at that pixel. */
    cursor: default;
  }
  .ellipse-toggle-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: #334155;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .ellipse-opacity-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: #334155;
    margin: -4px 0 8px 20px;
  }
  .ellipse-opacity-row input[type="range"] {
    flex: 1;
    accent-color: #334155;
  }
  .ellipse-opacity-row.disabled {
    color: #94a3b8;
    pointer-events: none;
    opacity: 0.6;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(15, 23, 42, 0.92);
    color: #fff;
    padding: 6px 9px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.45;
    z-index: 1000;
    max-width: 240px;
  }
  #tooltip.hidden {
    display: none;
  }
</style>
</head>
<body>
<header>
  <h1 id="page-title"></h1>
  <p id="page-subtitle"></p>
  <div id="toolbar">
    <div id="go-search-wrap">
      <input id="go-search-input" type="text" autocomplete="off" placeholder="Search GO id(s)/description to illuminate (adds to selection)...">
      <div id="go-search-suggestions" class="hidden"></div>
    </div>
    <button id="go-search-clear-btn" class="toolbar-btn">Clear GO</button>
    <label id="go-match-mode-label" class="toolbar-btn" title="When several GO terms are selected: off = light up by summed abundance, on = fully show only species that have every selected GO term at least once">
      <input type="checkbox" id="go-match-all-toggle"> Require all
    </label>
    <div id="species-search-wrap">
      <input id="species-search-input" type="text" autocomplete="off" placeholder="Search a species to highlight...">
      <div id="species-search-suggestions" class="hidden"></div>
    </div>
    <button id="species-search-clear-btn" class="toolbar-btn">Clear species</button>
    <button id="reset-zoom-btn" class="toolbar-btn">Reset zoom</button>
    <button id="download-png-btn" class="toolbar-btn">Download PNG</button>
  </div>
  <div id="go-search-chips"></div>
  <p id="go-search-status"></p>
  <p id="species-search-status"></p>
</header>
<div id="sidebar">
  <div class="sidebar-section">
    <h4>Taxonomic groups</h4>
    <div class="legend-actions">
      <button id="sidebar-select-all" class="legend-action">Select all</button>
      <button id="sidebar-select-none" class="legend-action">Select none</button>
    </div>
    <label class="ellipse-toggle-label">
      <input type="checkbox" id="ellipse-toggle"> Show group ellipses
    </label>
    <label class="ellipse-opacity-row disabled" id="ellipse-opacity-row">
      Opacity
      <input type="range" id="ellipse-opacity" min="0" max="60" value="12" step="1">
    </label>
    <label class="ellipse-toggle-label">
      <input type="checkbox" id="points-toggle" checked> Show points
    </label>
    <label class="ellipse-opacity-row" id="point-size-row">
      Point size
      <input type="range" id="point-size" min="20" max="220" value="100" step="10">
    </label>
    <p class="legend-hint">Drag &#x22EE;&#x22EE; to reorder — top group draws in front</p>
    <div id="sidebar-legend" class="legend"></div>
  </div>
  <div class="sidebar-section">
    <h4>Top GO terms per PC</h4>
    <div id="sidebar-top-loadings"></div>
  </div>
</div>
<div id="plot-container">
  <div class="plot-card">
    <div class="plot-row">
      <div class="axis-label-y"><span id="y-axis-label"></span></div>
      <div id="scatter-wrap">
        <svg id="scatter" class="scatter"></svg>
        <canvas id="points-canvas"></canvas>
      </div>
      <div id="go-count-rail" class="threshold-rail rail-go inactive" title="Drag to filter by GO count">
        <span class="rail-label">GO Abundance</span>
      </div>
      <div id="total-prots-rail" class="threshold-rail rail-prot inactive" title="Drag to filter by total annotated proteins">
        <span class="rail-label">Protein Count</span>
      </div>
    </div>
    <div class="axis-label-x" id="x-axis-label"></div>
    <div class="plot-hint">Scroll to zoom, drag to pan, click a species for its NCBI genome page.</div>
    <div id="pc3d-info" style="display:none;"></div>
    <div id="rotate-pad" class="rotate-pad" style="display:none;" title="Rotate the 3D view">
      <button type="button" id="rotate-up" aria-label="Rotate up">&#9650;</button>
      <button type="button" id="rotate-left" aria-label="Rotate left">&#9664;</button>
      <button type="button" id="rotate-right" aria-label="Rotate right">&#9654;</button>
      <button type="button" id="rotate-down" aria-label="Rotate down">&#9660;</button>
    </div>
  </div>
</div>
<div id="tooltip" class="hidden"></div>

<script id="general-pca-data" type="application/json">__GENERAL_PCA_DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("general-pca-data").textContent);

  var tooltip = document.getElementById("tooltip");

  document.getElementById("page-title").textContent = DATA.meta.title;
  document.getElementById("page-subtitle").textContent =
    DATA.species.length + " species, " + DATA.meta.n_go_terms_used +
    " GO terms used (" + DATA.meta.mode_label + ")";

  var ALL_GROUPS = (function () {
    var present = {};
    DATA.species.forEach(function (s) { present[s.group] = true; });
    return Object.keys(present).sort();
  })();

  // Legend display order, top-to-bottom; also the plot z-order, front-to-back
  // (drag rows in the sidebar to change which taxon group's points sit on
  // top when they overlap -- same idea as reordering layers in a photo/video
  // editor).
  var GROUP_ORDER = ALL_GROUPS.slice();

  var GROUP_COUNTS = (function () {
    var counts = {};
    DATA.species.forEach(function (s) { counts[s.group] = (counts[s.group] || 0) + 1; });
    return counts;
  })();

  var xs = DATA.species.map(function (s) { return s.pc1; });
  var ys = DATA.species.map(function (s) { return s.pc2; });
  var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
  var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
  var xPad = (xMax - xMin) * 0.08 || 1, yPad = (yMax - yMin) * 0.08 || 1;
  xMin -= xPad; xMax += xPad; yMin -= yPad; yMax += yPad;

  // Raw (unpadded) PC3 range, used only as the 3D-mode PC3 axis guide's
  // length -- there's no dedicated screen dimension for it, so it's sized
  // the same way the PC1/PC2 axis guides are sized off their own data range.
  var zs = DATA.species.map(function (s) { return s.pc3 || 0; });
  var zMin = Math.min.apply(null, zs), zMax = Math.max.apply(null, zs);

  var PLOT_W = 900, PLOT_H = 540;
  var BASE_RADIUS = 3.5;
  var BASE_STROKE_WIDTH = 0.5;
  // Same zoom-separation/marker-counter-scale behavior as the illuminated
  // PCA panels in interactive_go_tree.py: letting the viewBox shrink this
  // far, combined with counter-scaling marker radius back down on every
  // zoom step, is what lets a dense cluster pull apart under zoom instead
  // of every point + the gap between them growing at the same rate.
  var MIN_VIEW_FRACTION = 1 / 8000;
  var MARKER_ZOOM_GROWTH = 0.4;
  function scaleX(v) { return ((v - xMin) / (xMax - xMin)) * PLOT_W; }
  function scaleY(v) { return PLOT_H - ((v - yMin) / (yMax - yMin)) * PLOT_H; }

  var EXPLAINED = DATA.meta.explained_variance || [0, 0];
  var PC1_LABEL = "PC1 (" + (EXPLAINED[0] * 100).toFixed(1) + "% variance)";
  var PC2_LABEL = "PC2 (" + (EXPLAINED[1] * 100).toFixed(1) + "% variance)";
  var PC3_LABEL = EXPLAINED[2] !== undefined ? "PC3 (" + (EXPLAINED[2] * 100).toFixed(1) + "% variance)" : "PC3";
  document.getElementById("y-axis-label").textContent = PC2_LABEL;
  document.getElementById("x-axis-label").textContent = PC1_LABEL;

  var hiddenGroups = {};
  var showPoints = true; // "Show points" checkbox -- a display preference only, unlike the filters below it never affects which species feed a group's hull

  // Declared here (rather than down by the drag-to-rotate handler that owns
  // them) so rebuildHulls -- which runs once during initial setup, well
  // before that handler's code -- can safely check td3Yaw/td3Pitch without
  // finding them still undefined from var hoisting.
  var td3Yaw = 0, td3Pitch = 0;

  // ---- GO count threshold rail ----
  var goCountMin = 0;
  var goCountMax = Infinity;
  var railTrackMax = 1;
  var railMaxInput, railMinInput, railFill, railMinHandle, railMaxHandle, railTrackEl;
  var railEl = document.getElementById("go-count-rail");

  function positionRailHandles() {
    var minPct = (goCountMin / railTrackMax) * 100;
    var maxClamped = Math.min(goCountMax === Infinity ? railTrackMax : goCountMax, railTrackMax);
    var maxPct = (maxClamped / railTrackMax) * 100;
    railMinHandle.style.top = (100 - minPct) + "%";
    railMaxHandle.style.top = (100 - maxPct) + "%";
    railFill.style.top = (100 - maxPct) + "%";
    railFill.style.height = (maxPct - minPct) + "%";
  }

  function setRailMin(v) {
    if (isNaN(v)) return;
    v = Math.min(railTrackMax, Math.max(0, Math.round(v)));
    if (v > goCountMax) v = goCountMax;
    goCountMin = v;
    railMinInput.value = v;
    positionRailHandles();
    applyVisibility();
  }

  function setRailMax(v) {
    if (isNaN(v)) return;
    v = Math.min(railTrackMax, Math.max(0, Math.round(v)));
    if (v < goCountMin) v = goCountMin;
    goCountMax = v;
    railMaxInput.value = v;
    positionRailHandles();
    applyVisibility();
  }

  function resetRail(maxCount) {
    if (maxCount === 0) { hideRail(); return; }
    railTrackMax = maxCount;
    goCountMin = 0;
    goCountMax = maxCount;
    railMinInput.value = 0;
    railMaxInput.value = maxCount;
    positionRailHandles();
    railEl.classList.remove("inactive");
  }

  function hideRail() {
    railEl.classList.add("inactive");
    goCountMin = 0;
    goCountMax = Infinity;
  }

  // ---- Total-annotated-proteins threshold rail ----
  // Unlike the GO-count rail above (only active while a GO term search is
  // illuminated), total_prots is static per-species data -- present on
  // species records from general_pca_abundance.py / _raw.py (both load
  // --species-stats), absent entirely from presence_absence_pca.py (never
  // loads a species-stats file). So this rail is built and shown immediately
  // on load rather than in response to a search, and hidden only when NONE
  // of the page's species carry total_prots at all.
  //
  // Real --species-stats files can be missing Total_prots for a handful of
  // species (a data-quality gap, not a per-script thing), so this can't
  // require *every* species to have it -- that would hide the rail entirely
  // over one gap. Species missing it are treated as total_prots = 0 for
  // filtering (see tpValueOf below): they stay visible at the rail's
  // default full-range position, and only drop out once the user drags
  // tpMin above 0.
  var HAS_TOTAL_PROTS = DATA.species.some(function (s) { return s.total_prots !== undefined && s.total_prots !== null; });
  function tpValueOf(s) {
    return (s.total_prots === undefined || s.total_prots === null) ? 0 : s.total_prots;
  }
  var tpMin = 0, tpMax = Infinity, tpRailTrackMax = 1;
  var tpRailMaxInput, tpRailMinInput, tpRailFill, tpRailMinHandle, tpRailMaxHandle, tpRailTrackEl;
  var tpRailEl = document.getElementById("total-prots-rail");

  function positionTpRailHandles() {
    var minPct = (tpMin / tpRailTrackMax) * 100;
    var maxClamped = Math.min(tpMax === Infinity ? tpRailTrackMax : tpMax, tpRailTrackMax);
    var maxPct = (maxClamped / tpRailTrackMax) * 100;
    tpRailMinHandle.style.top = (100 - minPct) + "%";
    tpRailMaxHandle.style.top = (100 - maxPct) + "%";
    tpRailFill.style.top = (100 - maxPct) + "%";
    tpRailFill.style.height = (maxPct - minPct) + "%";
  }

  function setTpRailMin(v) {
    if (isNaN(v)) return;
    v = Math.min(tpRailTrackMax, Math.max(0, Math.round(v)));
    if (v > tpMax) v = tpMax;
    tpMin = v;
    tpRailMinInput.value = v;
    positionTpRailHandles();
    applyVisibility();
  }

  function setTpRailMax(v) {
    if (isNaN(v)) return;
    v = Math.min(tpRailTrackMax, Math.max(0, Math.round(v)));
    if (v < tpMin) v = tpMin;
    tpMax = v;
    tpRailMaxInput.value = v;
    positionTpRailHandles();
    applyVisibility();
  }

  // ---- GO term search / illumination ----
  var GO_SEARCH = DATA.go_search;
  var GO_SEARCH_SUPPORTED = typeof DecompressionStream !== "undefined" && typeof fetch !== "undefined";
  var goIndexById = {};
  GO_SEARCH.go_ids.forEach(function (id, i) { goIndexById[id] = i; });
  // Precomputed once so every keystroke is a plain substring scan, not a
  // re-derivation of "id + description" -- cheap enough at this term count
  // (tens of thousands) to not need an index structure.
  var GO_SEARCH_ENTRIES = GO_SEARCH.go_ids.map(function (id, i) {
    var desc = GO_SEARCH.go_desc[id] || "";
    return { id: id, desc: desc, idx: i, key: (id + " " + desc).toLowerCase() };
  });

  var activeGos = [];       // [{ go_id, description, idx }, ...] currently illuminated GO terms
  var activeGoCounts = [];  // parallel array of per-GO typed-array count views (same order as activeGos)
  var activeCounts = null;  // summed counts across activeGoCounts, aligned with DATA.species order
  var activeMatchMask = null; // when goRequireAll is on: bool per species, true iff every activeGos term has count > 0
  var goRequireAll = false;   // toggled by #go-match-all-toggle: sum-abundance gradient vs binary "has every term"

  function percentile(sortedAsc, p) {
    var idx = (p / 100) * (sortedAsc.length - 1);
    var lo = Math.floor(idx), hi = Math.ceil(idx);
    if (lo === hi) return sortedAsc[lo];
    return sortedAsc[lo] + (sortedAsc[hi] - sortedAsc[lo]) * (idx - lo);
  }

  // Only opacity encodes abundance here -- marker size stays fixed, unlike
  // illuminate_PCA.run_illuminated_PCA's PNGs which also grow the marker.
  //
  // Percentile-clipped (globally, across every plotted species) + sqrt
  // gamma, never plain log1p-of-global-max: with real data, a single
  // high-outlier species pushes log_max up enough that everything else
  // (e.g. 30 vs 600 counts, a 20x difference) lands within a narrow alpha
  // band and looks nearly identical. Clipping at the 99th percentile
  // before rescaling stretches the non-outlier majority back out to use
  // most of the 0-1 range, regardless of how extreme the single biggest
  // outlier is.
  //
  // The percentile is computed globally, not per taxon group: an earlier
  // version clipped within each group separately, which seemed like a
  // reasonable way to stay robust to one group having outlier abundance --
  // but it means each group's own top value gets rescaled to ~1.0 opacity
  // regardless of its absolute count, so a count of 30 in a low-abundance
  // group could outshine a count of 600 in a high-abundance group. A
  // global percentile keeps opacity tied to absolute abundance everywhere.
  function computeAlpha(counts) {
    var maxCount = Math.max.apply(null, counts);
    if (!(maxCount > 0)) {
      return counts.map(function () { return 0; });
    }

    var norm = counts.map(function (c) { return c / maxCount; });
    var nonzero = norm.filter(function (n) { return n > 0; }).sort(function (a, b) { return a - b; });
    var p99 = nonzero.length ? percentile(nonzero, 99) : 1.0;
    norm = norm.map(function (n) { return Math.min(n, p99); });
    if (p99 > 0) norm = norm.map(function (n) { return n / p99; });
    norm = norm.map(function (n) { return Math.sqrt(n); });

    return counts.map(function (c, i) { return c === 0 ? 0 : norm[i]; });
  }

  // The counts blob packs a nonzero-bitmap plus an array holding only the
  // nonzero values (see build_go_search_payload in general_pca_common.py),
  // gzip-compressed + base64-encoded server-side -- a dense species x
  // GO-term matrix is tens of MB even before this packing. Decoded once, on
  // first search, via the native DecompressionStream -- no bundled inflate
  // library. fetch() of a data: URL hands the base64 decoding itself to
  // the browser's native (fast) implementation instead of a manual atob +
  // per-character loop over a multi-million-character string.
  //
  // Unpacked back into a dense Uint32Array (not Uint16 -- the wire format
  // packs values as uint16 to stay compact, but a couple of real cells can
  // exceed that range; those ship separately in GO_SEARCH.overrides as
  // [flat_index, true_value] pairs, patched in after unpacking, which needs
  // the full 32-bit range to hold correctly) the same length as the
  // original dense matrix, so every existing consumer (countsForGoIndex's
  // subarray slicing chief among them) sees exactly the same shape it did
  // before this was ever sparse.
  function unpackGoCounts(buf) {
    var maskLen = GO_SEARCH.mask_bytes;
    var total = GO_SEARCH.n_go * GO_SEARCH.n_species;
    var maskBytes = new Uint8Array(buf, 0, maskLen);
    var values = new Uint16Array(buf, maskLen);

    var dense = new Uint32Array(total);
    var vi = 0;
    for (var bytePos = 0; bytePos < maskLen; bytePos++) {
      var byte = maskBytes[bytePos];
      if (byte === 0) continue;
      var base = bytePos * 8;
      for (var bit = 0; bit < 8; bit++) {
        // np.packbits default bit order is "big": bit 0 of each group of 8
        // is the byte's MSB (0x80), not its LSB.
        if (byte & (0x80 >> bit)) {
          var pos = base + bit;
          if (pos < total) dense[pos] = values[vi];
          vi++;
        }
      }
    }
    GO_SEARCH.overrides.forEach(function (ov) { dense[ov[0]] = ov[1]; });
    return dense;
  }

  var goCountsPromise = null;
  function loadGoCounts() {
    if (goCountsPromise) return goCountsPromise;
    goCountsPromise = fetch("data:application/octet-stream;base64," + GO_SEARCH.counts_gzip_b64)
      .then(function (resp) { return resp.body.pipeThrough(new DecompressionStream("gzip")); })
      .then(function (stream) { return new Response(stream).arrayBuffer(); })
      .then(function (buf) { return unpackGoCounts(buf); });
    return goCountsPromise;
  }

  // Counts are stored GO-major (see build_go_search_payload): all counts
  // for go_ids[0], then all counts for go_ids[1], etc, so one GO's counts
  // for every species is a single contiguous slice.
  function countsForGoIndex(typedArray, idx) {
    var n = GO_SEARCH.n_species;
    return typedArray.subarray(idx * n, (idx + 1) * n);
  }

  // Elementwise sum across several per-species count arrays, so illumination
  // can encode combined abundance across multiple GO terms picked one at a
  // time instead of only ever a single term.
  function sumCountArrays(countArrays) {
    var n = GO_SEARCH.n_species;
    var out = new Array(n).fill(0);
    countArrays.forEach(function (arr) {
      for (var i = 0; i < n; i++) out[i] += arr[i];
    });
    return out;
  }

  // Binary "has every selected GO term at least once" mask, for the
  // all-or-nothing "Require all" mode -- deliberately not a threshold on the
  // sum (a species with counts [5, 0] for two terms should read as a miss,
  // not a partial match, even though its sum is nonzero).
  function matchAllMask(countArrays) {
    var n = GO_SEARCH.n_species;
    var mask = new Array(n).fill(true);
    countArrays.forEach(function (arr) {
      for (var i = 0; i < n; i++) if (arr[i] === 0) mask[i] = false;
    });
    return mask;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // species.name is a directory name ("Genus_species", sometimes with a
  // strain/locality suffix) -- everywhere it's shown to the user, display it
  // as "Genus species" in italics instead, matching normal scientific-name
  // formatting. The underscore form is still what's used internally for
  // lookups/matching/URLs (e.g. openNcbiGenome's search fallback).
  function formatSpeciesName(name) {
    return String(name).replace(/_/g, " ");
  }

  // species.ncbi_id (see scripts/build_ncbi_accession_lookup.py) is a real
  // assembly accession (e.g. "GCF_010015735.1") for species resolved from
  // the Fungi/Viridiplantae 00_GenomeSource folders or the Metazoa NCBI
  // taxon-id lookup -- link straight to that assembly's NCBI Datasets page.
  // Species without one (Asgard's internal "ASG001"-style codes, Protists'
  // informal environmental-sample names, or anything the lookup just
  // couldn't resolve) fall back to the old NCBI Genome database text
  // search, which for underscore-joined "Genus_species" names at least has
  // a chance of finding something, same click-through pattern as go_space's
  // AmiGO link.
  function openNcbiGenome(species) {
    if (species.ncbi_id) {
      window.open("https://www.ncbi.nlm.nih.gov/datasets/genome/" + encodeURIComponent(species.ncbi_id) + "/", "_blank");
      return;
    }
    var query = encodeURIComponent(String(species.name).replace(/_/g, " "));
    window.open("https://www.ncbi.nlm.nih.gov/genome/?term=" + query, "_blank");
  }

  function formatLoading(v) {
    return (v >= 0 ? "+" : "") + v.toFixed(4);
  }

  // Ranks GO terms by how strongly they drive each PC axis, straight off
  // the fitted PCA model's loadings (see top_loadings_by_pc in
  // presence_absence_pca.py) -- a property of the PCA itself, the same
  // regardless of taxon filtering, so it's built once in the sidebar.
  // One collapsed <details> per (PC, direction) -- 4 total for a 2D-only
  // fit, 6 once PC3's loadings are included (see general_pca_abundance.py).
  // Collapsed by default (no "open" attribute) so the page loads showing
  // only the section titles, not every GO term in the sidebar at once.
  function buildSidebarTopLoadings() {
    var container = document.getElementById("sidebar-top-loadings");
    var pcLabels = { PC1: PC1_LABEL, PC2: PC2_LABEL, PC3: PC3_LABEL };

    function appendEntries(parent, entries) {
      entries.forEach(function (entry) {
        var row = document.createElement("div");
        row.className = "loading-row";
        row.innerHTML =
          '<span class="loading-go">' + escapeHtml(entry.go_id) + "</span>" +
          '<span class="loading-value">' + formatLoading(entry.loading) + "</span>" +
          '<div class="loading-desc">' + escapeHtml(entry.description) + "</div>";
        parent.appendChild(row);
      });
    }

    Object.keys(DATA.top_loadings || {}).forEach(function (pc) {
      var sections = DATA.top_loadings[pc];
      [["positive", "▲ Positive"], ["negative", "▼ Negative"]].forEach(function (pair) {
        var key = pair[0], label = pair[1];
        var entries = sections[key];
        if (!entries || !entries.length) return;

        var details = document.createElement("details");
        details.className = "loading-group";
        var summary = document.createElement("summary");
        summary.textContent = (pcLabels[pc] || pc) + " — " + label;
        details.appendChild(summary);
        appendEntries(details, entries);
        container.appendChild(details);
      });
    });
  }

  function showTooltip(evt, species, idx) {
    var pct = DATA.meta.n_go_terms_used > 0
      ? (species.go_terms_present / DATA.meta.n_go_terms_used) * 100
      : 0;
    var html =
      "<b><i>" + escapeHtml(formatSpeciesName(species.name)) + "</i></b><br>" +
      "Group: " + escapeHtml(species.group) + "<br>" +
      "GO terms present: " + species.go_terms_present + " / " + DATA.meta.n_go_terms_used + "<br>" +
      "Share: " + pct.toFixed(2) + "%";
    if (species.total_prots !== undefined && species.total_prots !== null) {
      html += "<br>Annotated proteins: " + species.total_prots;
    }
    if (activeGos.length && activeCounts) {
      if (activeGos.length === 1) {
        html += "<br>" + escapeHtml(activeGos[0].go_id) + " count: " + activeCounts[idx];
      } else {
        html += "<br>Summed count (" + activeGos.length + " GO terms): " + activeCounts[idx];
        activeGos.forEach(function (g, k) {
          html += "<br>&nbsp;&nbsp;" + escapeHtml(g.go_id) + ": " + activeGoCounts[k][idx];
        });
      }
    }
    if (speciesHighlightIdx === idx) {
      html += "<br><i>Highlighted species</i>";
    }
    tooltip.innerHTML = html;
    tooltip.classList.remove("hidden");
    moveTooltip(evt);
  }

  function moveTooltip(evt) {
    tooltip.style.left = (evt.clientX + 14) + "px";
    tooltip.style.top = (evt.clientY + 14) + "px";
  }

  function hideTooltip() {
    tooltip.classList.add("hidden");
  }

  // Shown when hovering a group's polyhedron where no species point happens
  // to sit -- summarizes the same shape instead of leaving the hover empty.
  // Stats are over whatever species currently feed that group's hull (see
  // rebuildHulls/groupSummaries), so they track the active filters exactly.
  function showGroupTooltip(evt, g) {
    var summary = groupSummaries[g];
    var html = "<b>" + escapeHtml(g) + "</b><br>Species in shape: " + (summary ? summary.n : 0);
    if (summary && summary.go.length) {
      html += "<br>GO terms present &mdash; mean: " + Math.round(mean(summary.go)) +
        ", median: " + Math.round(median(summary.go));
    }
    if (summary && summary.prot.length) {
      html += "<br>Annotated proteins &mdash; mean: " + Math.round(mean(summary.prot)) +
        ", median: " + Math.round(median(summary.prot));
    }
    tooltip.innerHTML = html;
    tooltip.classList.remove("hidden");
    moveTooltip(evt);
  }

  // A species is suppressed if its taxon group is toggled off, or -- while
  // illuminating a searched GO term -- it has zero counts for that term, or
  // its count falls outside the [goCountMin, goCountMax] threshold range, or
  // (independently of any GO search) its total_prots falls outside the
  // [tpMin, tpMax] threshold range. This is also the single source of truth
  // for which species feed each group's convex hull (see rebuildHulls
  // below): a species filtered out for having too few annotations or
  // proteins is dropped from the polyhedron too, not just hidden as a point.
  function isSpeciesSuppressed(s, i) {
    var suppressed = hiddenGroups[s.group];
    if (!suppressed && activeMatchMask) {
      suppressed = !activeMatchMask[i];
    } else if (!suppressed && activeCounts) {
      var count = activeCounts[i];
      suppressed = count === 0 || count < goCountMin || count > goCountMax;
    }
    if (!suppressed && HAS_TOTAL_PROTS) {
      var tp = tpValueOf(s);
      suppressed = tp < tpMin || tp > tpMax;
    }
    return suppressed;
  }

  var circleEls = [];
  function applyVisibility() {
    circleEls.forEach(function (c, i) {
      var s = DATA.species[i];
      c.style.display = (isSpeciesSuppressed(s, i) || !showPoints) ? "none" : "";
    });
    updateEllipseVisibility();
    scheduleHullRebuild();
  }

  function syncLegendCheckboxes() {
    document.querySelectorAll("input[data-group-checkbox]").forEach(function (cb) {
      cb.checked = !hiddenGroups[cb.getAttribute("data-group-checkbox")];
    });
  }

  function setAllGroupsHidden(hidden) {
    ALL_GROUPS.forEach(function (g) { hiddenGroups[g] = hidden; });
    applyVisibility();
    syncLegendCheckboxes();
  }

  // Mutates DATA.groups in place, so the next SVG export (appendLegendRows)
  // picks up the new color automatically -- no separate export-side sync.
  function updateGroupColor(g, hex) {
    DATA.groups[g] = hex;
    document.querySelectorAll('circle[data-group]').forEach(function (c) {
      if (c.getAttribute("data-group") === g) c.setAttribute("fill", hex);
    });
    if (ellipseEls[g]) {
      ellipseEls[g].forEach(function (el) {
        el.setAttribute("fill", hex);
        el.setAttribute("stroke", hex);
      });
    }
  }

  // Re-appends every circle in GROUP_ORDER order, back-to-front (last group
  // in the list gets appended first) so the first group in GROUP_ORDER ends
  // up last in the SVG's paint order -- i.e. drawn in front. SVG has no
  // z-index; sibling order IS paint order, so moving a legend row re-parents
  // (appendChild on an existing node just relocates it) that group's circles
  // to the end of the DOM.
  function reorderCirclesByGroupOrder() {
    for (var i = GROUP_ORDER.length - 1; i >= 0; i--) {
      var g = GROUP_ORDER[i];
      circleEls.forEach(function (c) {
        if (c.getAttribute("data-group") === g) rotatableGroup.appendChild(c);
      });
    }
  }

  function syncGroupOrderFromDom(legend) {
    GROUP_ORDER = Array.prototype.map.call(
      legend.querySelectorAll("[data-legend-group]"),
      function (row) { return row.getAttribute("data-legend-group"); }
    );
  }

  var draggedLegendRow = null;

  function buildSidebarLegend() {
    var selectAllBtn = document.getElementById("sidebar-select-all");
    var selectNoneBtn = document.getElementById("sidebar-select-none");
    selectAllBtn.onclick = function () { setAllGroupsHidden(false); };
    selectNoneBtn.onclick = function () { setAllGroupsHidden(true); };

    var legend = document.getElementById("sidebar-legend");
    GROUP_ORDER.forEach(function (g) {
      var row = document.createElement("div");
      row.className = "legend-row";
      row.setAttribute("data-legend-group", g);

      // Only the handle is draggable, not the whole row -- so clicking the
      // checkbox, swatch, or label text never gets misread as a drag.
      var handle = document.createElement("span");
      handle.className = "legend-drag-handle";
      handle.title = "Drag to reorder -- top of the list draws in front (while the plot is flat; once you rotate in 3D, actual depth decides)";
      handle.textContent = "⋮⋮";
      handle.draggable = true;
      handle.addEventListener("dragstart", function (evt) {
        draggedLegendRow = row;
        row.classList.add("dragging");
        evt.dataTransfer.effectAllowed = "move";
        evt.dataTransfer.setData("text/plain", g);
      });
      handle.addEventListener("dragend", function () {
        row.classList.remove("dragging");
        draggedLegendRow = null;
        syncGroupOrderFromDom(legend);
        reorderCirclesByGroupOrder();
      });
      row.appendChild(handle);

      // Live-reorders the DOM as the drag passes over other rows (rather
      // than only on drop), same as most "sortable layer list" UIs.
      row.addEventListener("dragover", function (evt) {
        if (!draggedLegendRow || draggedLegendRow === row) return;
        evt.preventDefault();
        var rect = row.getBoundingClientRect();
        var before = (evt.clientY - rect.top) < rect.height / 2;
        legend.insertBefore(draggedLegendRow, before ? row : row.nextSibling);
      });
      row.addEventListener("drop", function (evt) { evt.preventDefault(); });

      var label = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.setAttribute("data-group-checkbox", g);
      cb.checked = !hiddenGroups[g];
      cb.onchange = function () {
        hiddenGroups[g] = !cb.checked;
        applyVisibility();
      };
      var swatch = document.createElement("input");
      swatch.type = "color";
      swatch.className = "swatch";
      swatch.value = DATA.groups[g] || "#999999";
      swatch.title = "Click to change the color for " + g;
      swatch.addEventListener("input", function () { updateGroupColor(g, swatch.value); });
      var count = document.createElement("span");
      count.className = "count";

  function vSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

  // Randomized-order incremental 3D convex hull (see O'Rourke, "Computational
